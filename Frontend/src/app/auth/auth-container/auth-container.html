
<div class="glass-container">

  <div class="switch-buttons">
    <button [class.active]="!isSignUpActive" (click)="switchTab(false)">
      Login
    </button>
    <button [class.active]="isSignUpActive" (click)="switchTab(true)">
      Sign Up
    </button>
  </div>

  @if (!isSignUpActive) {
    <div class="form-content animate-mode">
      <h2>Welcome Back!</h2>
      <p>Login to continue.</p>

      <form (ngSubmit)="onLogin()">
        <div class="input-group">
          <input type="email"
                 placeholder="Email Address"
                 [(ngModel)]="loginData.email"
                 name="email"
                 required>
        </div>

        <div class="input-group">
          <input type="password"
                 placeholder="Password"
                 [(ngModel)]="loginData.password"
                 name="password"
                 required>
        </div>

        <button type="submit" class="submit-btn">
          Login
        </button>

        @if (message) {
          <div class="prompt-msg"
               [ngClass]="{
                 'success-msg': messageType === 'success',
                 'error-msg': messageType === 'error'
               }">
            {{ message }}
          </div>
        }
      </form>
    </div>
  }

  @if (isSignUpActive) {
    <div class="form-content animate-mode">
      <h2>Create Account</h2>
      <p>Join our community.</p>

      <form (ngSubmit)="onRegister()">
        <div class="input-group">
          <input type="text"
                 placeholder="Full Name"
                 [(ngModel)]="registerData.fullName"
                 name="fullName"
                 required>
        </div>

        <div class="input-group">
          <input type="email"
                 placeholder="Email Address"
                 [(ngModel)]="registerData.email"
                 name="remail"
                 required>
        </div>

        <div class="input-group">
          <input type="password"
                 placeholder="Password"
                 [(ngModel)]="registerData.password"
                 name="rpassword"
                 required>
        </div>

        <button type="submit" class="submit-btn">
          Sign Up
        </button>

        @if (message) {
          <div class="prompt-msg"
               [ngClass]="{
                 'success-msg': messageType === 'success',
                 'error-msg': messageType === 'error'
               }">
            {{ message }}
          </div>
        }
      </form>
    </div>
  }

</div>
