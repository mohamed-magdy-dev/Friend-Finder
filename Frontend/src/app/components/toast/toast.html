@if (toast) {
  <div class="toast-container position-fixed bottom-0 end-0 p-4" style="z-index: 1060;">
    <div class="toast show align-items-center text-white border-0 shadow-lg ff-toast-anim" 
         [ngClass]="toast.type === 'success' ? 'bg-success' : 'bg-danger'" 
         role="alert" aria-live="assertive" aria-atomic="true" style="border-radius: 12px;">
      <div class="d-flex px-2 py-1">
        <div class="toast-body fw-bold" style="font-size: 1.05rem;">
          <i class="bi me-2" [ngClass]="toast.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
          {{ toast.message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto shadow-none" (click)="close()"></button>
      </div>
    </div>
  </div>
}
